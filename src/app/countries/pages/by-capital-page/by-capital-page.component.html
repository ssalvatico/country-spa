<h2>By Capital</h2>

<div class="row">
    <div class="col">
        <app-shared-searchbox
            placeholder="Search by capital..."
            (onDebounce)="searchByCapital($event)"
            [initialValue]="initialValue"
            (onClear)="clearSearch()"
        ></app-shared-searchbox>
    </div>
</div>

<div class="row">
    <div class="col">
        @if (isLoading) {
            <app-shared-loading-spinner></app-shared-loading-spinner>
        }
        <app-shared-pagination
            [total]="total"
            [pageSize]="pageSize"
            [currentPage]="page"
            (pageChange)="changePage($event)"
        ></app-shared-pagination>
        <app-countries-country-table [countries]="getCountries"></app-countries-country-table>
    </div>
</div>
