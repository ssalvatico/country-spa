<h2>By Country</h2>

<div class="row">
    <div class="col">
        <app-shared-searchbox
            placeholder="Search by country..."
            (onDebounce)="searchByCountry($event)"
            [initialValue]="initialValue"
            (onClear)="clearSearch()"
        ></app-shared-searchbox>
    </div>
</div>

<div class="row">
    <div class="col">
        @if (isLoading) {
            <app-shared-loading-spinner></app-shared-loading-spinner>
        }
        <app-countries-country-table [countries]="getCountries"></app-countries-country-table>
        <app-shared-pagination
            [total]="total"
            [pageSize]="pageSize"
            [currentPage]="page"
            (pageChange)="changePage($event)"
        ></app-shared-pagination>
    </div>
</div>
