<h2>By Country</h2>

<div class="row">
    <div class="col">
        <app-shared-searchbox
            placeholder="Search by country..."
            (onDebounce)="searchByCountry($event)"
        ></app-shared-searchbox>
    </div>
</div>

<div class="row">
    <div class="col">
        @if (isLoading) {
            <app-shared-loading-spinner></app-shared-loading-spinner>
        }
        <app-countries-country-table [countries]="getCountries"></app-countries-country-table>
    </div>
</div>
