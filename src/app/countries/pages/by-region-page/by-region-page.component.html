<h2>By Region</h2>

<div class="row">
    <div class="col d-flex w-100 mt-2 mb-4" style="gap: 0.5rem;">
        @for (region of regions; track $index){
            <button
                class="btn flex-fill"
                (click)="searchByRegion(region)"
                [class.active]="selectedRegion === region"
                [disabled]="selectedRegion === region"
            >{{ region | uppercase }}</button>
        }

        <!-- <app-shared-searchbox
            placeholder="Search by region..."
            (onDebounce)="searchByRegion($event)"
        ></app-shared-searchbox> -->
    </div>
</div>

<div class="row">
    <div class="col">
        @if (isLoading) {
            <app-shared-loading-spinner></app-shared-loading-spinner>
        }
        <app-countries-country-table [countries]="getCountries"></app-countries-country-table>
    </div>
</div>
