<h2>Por continente</h2>
<hr>

<div class="row">
    <div class="col">
        <app-shared-searchbox
            placeholder="Buscar por capital..."
            (onValue)="searchByRegion($event)"
        ></app-shared-searchbox>
    </div>
</div>

<div class="row">
    <div class="col">
        <hr>
        @if (isLoading) {
            <app-shared-loading-spinner></app-shared-loading-spinner>
        }
        <app-countries-country-table [countries]="getCountries"></app-countries-country-table>
    </div>
</div>
